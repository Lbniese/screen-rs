[advisories]
version = 2
# cargo-deny 0.20+ treats vulnerability and unsound advisories as errors;
# the removed vulnerability key is therefore enforced by the default policy.
yanked = "deny"

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "NCSA",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
